name: CI/CD workflow

env:
  SERVER_IP: "51.210.40.253"
  SERVER_USER: root

on:
  push:
    branches: main

jobs:
  # CI
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      # Récupération du code
      - name: checkout code
        uses: actions/checkout@v4
      # Installation de node.js
      - name: install node.js
        uses: actions/setup-node@v3
        with:
          cache: "npm"
          cache-dependency-path: ./server/package-lock.json
      # Installation des dépendances
      - name: install dependencies
        run: npm ci --cache .npm --prefer-offline
      # Vérification du code
      - name: verify code
        run: npm run lint
      # Vérification des vulnérabilités des dépendances
      - name: verify dependencie's vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
      # Exécution des tests
      - name: execute tests
        run: npm run test:ci

  # CD
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: deploy on the server
        run: | 
          eval $(ssh-agent -s)
          ssh-add - <<< "${{ secrets.SSH_KEY_VPS }}"
          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
          scp -r ./server $SERVER_USER@$SERVER_IP:/var/www
          ssh $SERVER_USER@$SERVER_IP "cd /var/www/server && npm install --omit=dev"
          ssh $SERVER_USER@$SERVER_IP "cd /var/www/server && pm2 startOrRestart ecosystem.config.js --env production && pm2 save"




